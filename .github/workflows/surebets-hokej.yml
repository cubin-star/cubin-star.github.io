# SureBets Daily Hockey Tips – runs every day at 7:00 AM UTC
# Fetches odds from Hockey API, selects Over 5.5 tips using
# Variant A/B goal criteria, and commits hokejs.json to GitHub Pages.
#
# SETUP:
# 1. Copy this file to your GitHub Pages repo:
#    cubin-star/cubin-star.github.io/.github/workflows/surebets-hokej.yml
# 2. Copy tools/generate_hokej.py to the root of that repo
# 3. In the repo Settings → Secrets → Actions, add:
#    API_HOCKEY_KEY = your hockey API key from api-sports.io
# 4. Enable Actions in the repo

name: SureBets Daily Hockey Tips

on:
  schedule:
    # Every day at 7:00 AM UTC
    - cron: '0 7 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate tips
        env:
          API_HOCKEY_KEY: ${{ secrets.API_HOCKEY_KEY }}
        run: python generate_hokej.py

      - name: Commit and push
        run: |
          git config user.name "SureBets Bot"
          git config user.email "bot@surebets.app"
          git add hokejs.json
          git diff --staged --quiet || git commit -m "🏒 SureBets hockey tips $(date -u +%Y-%m-%d)"
          git push
