# Denní aktualizace hot.json – výběr 6 fotbalových zápasů (Over, kurz 2.2-3.0)
# Hlavní čas: 7:17 UTC (9:17 CEST). Záložní čas: 9:17 UTC (11:17 CEST)
# – záloha se sama ukončí, pokud dnes už hot.json byl aktualizován.

name: Daily Picks Bot

on:
  schedule:
    - cron: '17 7 * * *' # 7:17 UTC = 9:17 CEST – hlavní čas
    - cron: '17 9 * * *' # 9:17 UTC = 11:17 CEST – záloha, kdyby GitHub první slot vynechal
  workflow_dispatch: # Ruční spuštění

permissions:
  contents: write

jobs:
  update-picks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # potřebujeme historii, abychom zjistili poslední commit hot.json

      - name: Skip if hot.json already updated today
        id: guard
        run: |
          # Guard se uplatní JEN u záložního naplánovaného slotu (17 9 UTC).
          # Hlavní slot, ruční spuštění i re-run běží vždy.
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" != "17 9 * * *" ]; then
            echo "Není to záložní naplánovaný běh (event=${{ github.event_name }}, schedule=${{ github.event.schedule }}) – generuji vždy."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          LAST=$(git log -1 --format=%cs -- hot.json || echo "")
          echo "Záložní běh. Dnes (UTC): $TODAY, poslední commit hot.json: $LAST"
          if [ "$LAST" = "$TODAY" ]; then
            echo "hot.json už byl dnes aktualizován, záložní běh se přeskakuje."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "hot.json dnes ještě nebyl aktualizován – záložní běh generuje."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run bot
        if: steps.guard.outputs.skip != 'true'
        env:
          API_FOOTBALL_KEY1: ${{ secrets.API_FOOTBALL_KEY1 }}
        run: node fetch-matches.mjs

      - name: Commit & push
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "Kombík Bot"
          git config user.email "bot@kombik.cz"
          git add hot.json live1.json best.json
          if git diff --cached --quiet; then
            echo "Žádné změny k commitu, končím."
            exit 0
          fi
          git commit -m "🤖 Denní tipy $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push selhal (pokus $i/3), čekám 5s..."
            sleep 5
          done
          echo "Push se nezdařil ani po 3 pokusech."
          exit 1
