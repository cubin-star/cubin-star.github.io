# Denní aktualizace hot.json, best.json, tips-kombik.json, react1/2/3.json.
# Hlavní čas: 09:20 Europe/Prague (po dokončení FVE ENGINE ~09:00).
# GitHub cron umí jen UTC, proto jsou pro každý čas dva sloty (letní/zimní)
# a schedule-gate.mjs pustí jen ten, který odpovídá aktuálnímu offsetu Prahy.
# Záloha 11:50 Praha se spustí jen tehdy, když dnes ještě neproběhl commit.

name: Daily Picks Bot

on:
  schedule:
    - cron: '20 7 * * *'  # 09:20 CEST – hlavní (léto)
    - cron: '20 8 * * *'  # 09:20 CET  – hlavní (zima)
    - cron: '50 9 * * *'  # 11:50 CEST – záloha (léto)
    - cron: '50 10 * * *' # 11:50 CET  – záloha (zima)
  workflow_dispatch: # Ruční spuštění
    inputs:
      mode:
        description: 'Režim: full = kompletní generování (výchozí), hot-only = jen THE OVER 6 (hot.json + best.json)'
        required: true
        default: full
        type: choice
        options:
          - full
          - hot-only
      confirm_hot:
        description: 'HOT ONLY: potvrzuji přegenerování i už kompletního dnešního hot.json'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Běhy se nikdy nepřekrývají – záloha počká na hlavní běh a pak se sama přeskočí.
concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  update-picks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # potřebujeme historii, abychom zjistili poslední commit hot.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: DST gate (09:20 Europe/Prague)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: node schedule-gate.mjs

      - name: Plan run (overeny stav dnesnich vystupu)
        id: guard
        if: steps.gate.outputs.run == 'true'
        env:
          KIND: ${{ steps.gate.outputs.kind }}
          MANUAL_MODE: ${{ github.event.inputs.mode || 'full' }}
          FORCE: ${{ github.event.inputs.confirm_hot || 'false' }}
        run: |
          # Kazdy beh (hlavni, zaloha i rucni): nejdriv nejnovejsi stav (soubeh / opozdeny hlavni beh).
          # Rucni FULL vraci vzdy full (puvodni chovani), rucni HOT ONLY nikdy full.
          git pull --ff-only origin "${GITHUB_REF_NAME}" || { echo "::warning::git pull selhal - nelze overit stav, beh se neprovede"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          node backup-plan.mjs
          MODE=$(grep '^mode=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          if [ "$MODE" = "full" ] || [ "$MODE" = "hot-only" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.gate.outputs.run == 'true' && steps.guard.outputs.skip != 'true'
        run: |
          node test-tiers.mjs
          node test-react1.mjs
          node test-selection.mjs
          node test-stress.mjs
          node test-engine.mjs
          node test-hot.mjs
          node test-backup.mjs

      - name: Run bot
        if: steps.gate.outputs.run == 'true' && steps.guard.outputs.skip != 'true'
        env:
          API_FOOTBALL_KEY1: ${{ secrets.API_FOOTBALL_KEY1 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOT_ONLY: ${{ steps.guard.outputs.mode == 'hot-only' && '1' || '0' }}
        run: node fetch-matches.mjs

      - name: Commit & push
        if: steps.gate.outputs.run == 'true' && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "Kombík Bot"
          git config user.email "bot@kombik.cz"
          # POZOR: bot zapisuje tips-kombik.json, NIKOLIV tips.json – ten patri
          # botovi generate_fotbal.py a ma jinou strukturu klicu.
          if [ "${{ steps.guard.outputs.mode }}" = "hot-only" ]; then
            git add hot.json best.json
            node backup-plan.mjs --assert-hot-only || exit 1
            MSG="🤖 THE OVER 6 (záloha HOT ONLY) $(TZ=Europe/Prague date +%Y-%m-%d)"
          else
            git add hot.json live1.json best.json tips-kombik.json react1.json react2.json react3.json league-goals.json
            MSG="🤖 Denní tipy $(TZ=Europe/Prague date +%Y-%m-%d)"
          fi
          if git diff --cached --quiet; then
            echo "Žádné změny k commitu, končím."
            exit 0
          fi
          git commit -m "$MSG"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push selhal (pokus $i/3), čekám 5s..."
            sleep 5
          done
          echo "Push se nezdařil ani po 3 pokusech."
          exit 1
