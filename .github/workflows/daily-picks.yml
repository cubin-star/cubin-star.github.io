# Denní aktualizace hot.json – výběr 6 fotbalových zápasů (Over, kurz 2.2-3.0)
# Spouští se každý den v 7:00 UTC (= 9:00 CEST / 8:00 CET)

name: Daily Picks Bot

on:
  schedule:
    - cron: '0 7 * * *' # 7:00 UTC = 9:00 CEST
  workflow_dispatch: # Ruční spuštění

permissions:
  contents: write

jobs:
  update-picks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run bot
        env:
          API_FOOTBALL_KEY1: ${{ secrets.API_FOOTBALL_KEY1 }}
        run: node fetch-matches.mjs

      - name: Commit & push
        run: |
          git config user.name "Kombík Bot"
          git config user.email "bot@kombik.cz"
          git add hot.json state.json live1.json
          git diff --cached --quiet || git commit -m "🤖 Denní tipy $(date +%Y-%m-%d)"
          git pull --rebase
          git push
