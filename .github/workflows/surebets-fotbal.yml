# SureBets Daily Football Tips – runs every day at 7:00 AM UTC
# Fetches odds from API-Football, selects Over 1.5 tips using
# Variant A/B goal criteria, and commits fotbals.json to GitHub Pages.
#
# SETUP:
# 1. Copy this file to your GitHub Pages repo:
#    cubin-star/cubin-star.github.io/.github/workflows/surebets-fotbal.yml
# 2. Copy tools/generate_fotbal.py to the root of that repo
# 3. In the repo Settings → Secrets → Actions, add:
#    API_FOOTBALL_KEY1 = your API key from https://www.api-football.com/
# 4. Enable Actions in the repo

name: SureBets Daily Football Tips

on:
  schedule:
    # Every day at 7:00 AM UTC
    - cron: '0 7 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate tips
        env:
          API_FOOTBALL_KEY1: ${{ secrets.API_FOOTBALL_KEY1 }}
        run: python generate_fotbal.py

      - name: Commit and push
        run: |
          git config user.name "SureBets Bot"
          git config user.email "bot@surebets.app"
          git add fotbals.json tips.json live.json
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "⚽ SureBets tips $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
