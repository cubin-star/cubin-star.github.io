name: Daily Tips Update

on:
  schedule:
    # Every day at 07:00 UTC (09:00 CET in winter, 08:00 CET in summer)
    - cron: "0 7 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-tips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Fetch today's tips
        env:
          ODDS_API_KEY1: ${{ secrets.ODDS_API_KEY1 }}
        run: python scraper/fetch_tips.py

      - name: Commit & push updated tips.json
        run: |
          git config user.name "tips-bot"
          git config user.email "tips-bot@users.noreply.github.com"
          git add tips.json
          if git diff --cached --quiet; then
            echo "No changes to tips.json – skipping commit."
          else
            git commit -m "🤖 Daily tips update ($(date -u +%Y-%m-%d))"
            git push
          fi
