# ValueBets Bot
#
# Dva samostatné jednoduché joby – stejný vzor jako ostatní boti v tomto repu.
#
# translate : čte live.json + live2.json (READ-ONLY), dohledá kurzy Over 2.5
#             z API-Football a zapíše valuetips.json. Běží každý den v 08:00 UTC
#             (po Daily Tip Generatoru 06:00 a SureBets 07:00 UTC).
#
# evaluate  : pro skončené zápasy z valuetips.json zapíše výsledek + skóre
#             do valuebetshistory.json a odstraní je z valuetips.json.
#             Běží každou hodinu.
#
# SETUP:
# 1. Secret API_FOOTBALL_KEY1 v Settings -> Secrets and variables -> Actions.
# 2. Settings -> Actions -> General: "Read and write permissions" pro GITHUB_TOKEN.

name: ValueBets Bot

on:
  schedule:
    - cron: '0 8 * * *'    # translate – každý den 08:00 UTC (10:00 CEST)
    - cron: '0 * * * *'    # evaluate  – každou celou hodinu
  workflow_dispatch:        # ruční spuštění tlačítkem na GitHubu

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: translate – spustí se jen v 08:xx UTC
  # ---------------------------------------------------------------------------
  translate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '0 8')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Run translate
        env:
          API_FOOTBALL_KEY1: ${{ secrets.API_FOOTBALL_KEY1 }}
        run: dotnet run --project tools/ValueBetsBot/ValueBetsBot.csproj -c Release -- translate .

      - name: Commit and push
        run: |
          git config user.name  "ValueBets Bot"
          git config user.email "bot@valuebets.app"
          git add valuetips.json
          git diff --staged --quiet || git commit -m "💰 ValueBets tips $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

  # ---------------------------------------------------------------------------
  # JOB 2: evaluate – spustí se každou hodinu (ne v 08:xx, to dělá translate)
  # ---------------------------------------------------------------------------
  evaluate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '0 *')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Run evaluate
        env:
          API_FOOTBALL_KEY1: ${{ secrets.API_FOOTBALL_KEY1 }}
        run: dotnet run --project tools/ValueBetsBot/ValueBetsBot.csproj -c Release -- evaluate . --max-age-hours 48

      - name: Commit and push
        run: |
          git config user.name  "ValueBets Bot"
          git config user.email "bot@valuebets.app"
          git add valuetips.json valuebetshistory.json
          git diff --staged --quiet || git commit -m "📊 ValueBets evaluate $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
