# ValueBets Bot – EVALUATE
# Čte tipy přímo z live2.json, vyhodnotí zápasy u nichž nastalo 8:00 UTC
# následujícího dne po výkopu, a zapíše výsledky + ROI do:
#   valuebetshistory.json
#   valuebetsroi.json
#
# SETUP:
# 1. Secret API_FOOTBALL_KEY1 v Settings -> Secrets and variables -> Actions.
# 2. Settings -> Actions -> General: "Read and write permissions" pro GITHUB_TOKEN.

name: ValueBets Evaluate

on:
  schedule:
    - cron: '0 8 * * *'    # každý den 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Run evaluate
        env:
          API_FOOTBALL_KEY1: ${{ secrets.API_FOOTBALL_KEY1 }}
        run: dotnet run --project tools/ValueBetsBot/ValueBetsBot.csproj -c Release -- evaluate .

      - name: Commit and push
        run: |
          git config user.name  "ValueBets Bot"
          git config user.email "bot@valuebets.app"
          git add valuebetshistory.json valuebetsroi.json
          git diff --staged --quiet || git commit -m "📊 ValueBets results $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
