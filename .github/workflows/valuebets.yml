# ValueBets Bot
#
# translate : čte live.json + live2.json (READ-ONLY), pro každý zápas dohledá
#             v API-Football kurz na Over 2.5 a zapíše valuetips.json.
# evaluate  : pro skončené zápasy z valuetips.json doplní výsledek
#             do valuebetshistory.json (OK / KO).
#
# .NET 10 konzolová aplikace ze složky tools/ValueBetsBot.
#
# Cron rozvrh:
#   '5 9  * * *'  -> translate (primární run)
#   '15 9 * * *'  -> translate (záložní run, idempotentní – pokud primární proběhl, nic neudělá)
#   '0 *  * * *'  -> evaluate
#
# Detekce modu se NEdělá porovnáním cron stringu (to je křehké), ale podle UTC času
# spuštění: pokud je hodina = 9 a minuta v okně 0..29, jde o translate, jinak evaluate.
#
# SETUP:
# 1. Secret API_FOOTBALL_KEY1 musí být v Settings -> Secrets and variables -> Actions.
# 2. Settings -> Actions -> General: "Read and write permissions" pro GITHUB_TOKEN.

name: ValueBets Bot

on:
  schedule:
    - cron: '5 9 * * *'      # translate – denně 09:05 UTC (primární)
    - cron: '15 9 * * *'     # translate – denně 09:15 UTC (záloha pro případ že GH cron přeskočí)
    - cron: '0 * * * *'      # evaluate  – každou celou hodinu
  workflow_dispatch:
    inputs:
      mode:
        description: 'translate | evaluate | both'
        required: true
        default: 'both'
        type: choice
        options:
          - translate
          - evaluate
          - both

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # potřebujeme historii, abychom poznali, jestli dnes translate už proběhl

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Decide mode
        id: mode
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            value="${{ github.event.inputs.mode }}"
            echo "Mode from manual dispatch: $value"
          else
            hour=$(date -u +%H)
            min=$(date -u +%M)
            # Translate vždy v 9. hodině UTC (primární cron 09:05, záložní 09:15).
            # Vše ostatní = evaluate.
            if [ "$hour" = "09" ] && [ "$min" -lt 30 ]; then
              value="translate"
            else
              value="evaluate"
            fi
            echo "Mode from schedule (UTC $hour:$min): $value"
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Skip if today's translate already ran
        id: guard
        if: steps.mode.outputs.value == 'translate' && github.event_name == 'schedule'
        run: |
          today=$(date -u +%Y-%m-%d)
          if git log --since="${today}T00:00:00Z" --author="ValueBets Bot" --pretty=format:"%s" | grep -E "valuebets bot: (translate|both)" > /dev/null; then
            echo "Translate already ran today – skipping this backup run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No translate commit found for $today – proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run translate
        if: (steps.mode.outputs.value == 'translate' || steps.mode.outputs.value == 'both') && steps.guard.outputs.skip != 'true'
        env:
          API_FOOTBALL_KEY1: ${{ secrets.API_FOOTBALL_KEY1 }}
        run: dotnet run --project tools/ValueBetsBot/ValueBetsBot.csproj -c Release -- translate .

      - name: Run evaluate
        if: steps.mode.outputs.value == 'evaluate' || steps.mode.outputs.value == 'both'
        env:
          API_FOOTBALL_KEY1: ${{ secrets.API_FOOTBALL_KEY1 }}
        run: dotnet run --project tools/ValueBetsBot/ValueBetsBot.csproj -c Release -- evaluate . --max-age-hours 48

      - name: Commit & push
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "ValueBets Bot"
          git config user.email "bot@valuebets.app"
          # Pojistka: NIKDY nepřibalit live.json / live2.json – ty patří jiné aplikaci.
          git reset HEAD -- live.json live2.json 2>/dev/null || true
          git checkout -- live.json live2.json 2>/dev/null || true
          git add valuetips.json valuebetshistory.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "valuebets bot: ${{ steps.mode.outputs.value }} $(date -u +%Y-%m-%d_%H-%M)"
            git pull --rebase
            git push
          fi
