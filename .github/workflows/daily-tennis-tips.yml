name: Daily Tennis Tips Bot

on:
  schedule:
    # 7:00 UTC = 8:00 CET (zima) / 9:00 CEST (leto)
    - cron: '0 7 * * *'
  workflow_dispatch: # Moznost rucniho spusteni z GitHub Actions

permissions:
  contents: write

jobs:
  fetch-tips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch tennis tips
        env:
          TENIS_API_KEY: ${{ secrets.TENIS_API_KEY }}
          ODDS_API_KEY3: ${{ secrets.ODDS_API_KEY3 }}
        run: python scripts/fetch_tennis_tips.py

      - name: Commit and push updated tenis.json
        run: |
          git config user.name "Tennis Tips Bot"
          git config user.email "bot@github-actions"
          git add tenis.json
          if git diff --staged --quiet; then
            echo "Zadne zmeny v tenis.json"
          else
            git commit -m "🎾 Aktualizace tipu $(date +'%d.%m.%Y %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi

